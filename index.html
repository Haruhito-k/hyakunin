
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百人一首クイズ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
      background: #f5f0e6;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 18px #00000012;
    }

    h1 {
      text-align: center;
      color: #8b3a3a;
      font-size: 26px;
    }

    .description {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .score {
      display: flex;
      justify-content: space-around;
      gap: 10px;
      background: #f8eee7;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 22px;
      text-align: center;
    }

    .score strong {
      display: block;
      font-size: 22px;
      color: #8b3a3a;
      margin-top: 5px;
    }

    .question-box {
      background: #fffaf0;
      border: 2px solid #d8bd8a;
      border-radius: 14px;
      padding: 24px 16px;
      text-align: center;
    }

    .label {
      font-size: 14px;
      color: #8b3a3a;
      font-weight: bold;
    }

    #question {
      font-size: 25px;
      line-height: 1.9;
      margin: 18px 0 5px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    h2 {
      font-size: 18px;
      margin-top: 28px;
    }

    #choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      width: 100%;
      padding: 16px;
      border: 2px solid #e3ddd2;
      border-radius: 10px;
      background: white;
      font-size: 17px;
      line-height: 1.7;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .choice:hover:not(:disabled) {
      background: #fff3dc;
      border-color: #bd9251;
    }

    .choice:disabled {
      cursor: default;
      color: #333;
      opacity: 1;
    }

    .choice.correct {
      background: #e2f5e5;
      border-color: #399653;
    }

    .choice.wrong {
      background: #fde8e6;
      border-color: #d9534f;
    }

    #feedback {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      line-height: 1.8;
      white-space: pre-line;
      display: none;
    }

    #feedback.correct-message {
      display: block;
      background: #e2f5e5;
      color: #216b35;
    }

    #feedback.wrong-message {
      display: block;
      background: #fde8e6;
      color: #a12e2a;
    }

    #nextButton, #restartButton {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #8b3a3a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #nextButton:hover, #restartButton:hover {
      background: #6f2929;
    }

    #nextButton:disabled {
      background: #bca5a5;
      cursor: default;
    }

    #result {
      display: none;
      text-align: center;
      margin-top: 25px;
      padding: 22px;
      background: #fff3dc;
      border-radius: 12px;
    }

    #result h2 {
      font-size: 24px;
      color: #8b3a3a;
      margin-top: 0;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 18px 14px;
      }

      h1 {
        font-size: 22px;
      }

      #question {
        font-size: 21px;
      }

      .choice {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>🌸 百人一首クイズ 🌸</h1>

    <p class="description">
      上の句に合う下の句を選ぼう！<br>
      4つの選択肢から正解を選んでね。
    </p>

    <div class="score">
      <div>
        問題
        <strong id="progress">1 / 10</strong>
      </div>
      <div>
        正解数
        <strong id="correctCount">0</strong>
      </div>
      <div>
        正解率
        <strong id="accuracy">0%</strong>
      </div>
    </div>

    <section class="question-box">
      <div class="label">この上の句の続きは？</div>
      <div id="question"></div>
    </section>

    <h2>下の句を選んでください</h2>

    <div id="choices"></div>

    <div id="feedback" aria-live="polite"></div>

    <button id="nextButton" disabled>
      次の問題へ →
    </button>

    <section id="result">
      <h2>🎉 10問終了！</h2>
      <p id="finalScore"></p>
      <p id="finalMessage"></p>
      <button id="restartButton">もう一度挑戦する</button>
    </section>
  </main>

  <script>
    // 百人一首 第1番〜第10番
    // 画面には番号も作者名も表示しない
    const poems = [
      {
        no: 1,
        upper: "秋の田の　かりほの庵の　苫をあらみ",
        lower: "わが衣手は　露にぬれつつ"
      },
      {
        no: 2,
        upper: "春過ぎて　夏来にけらし　白妙の",
        lower: "衣ほすてふ　天の香具山"
      },
      {
        no: 3,
        upper: "あしびきの　山鳥の尾の　しだり尾の",
        lower: "ながながし夜を　ひとりかも寝む"
      },
      {
        no: 4,
        upper: "田子の浦に　うち出でて見れば　白妙の",
        lower: "富士の高嶺に　雪は降りつつ"
      },
      {
        no: 5,
        upper: "奥山に　紅葉踏み分け　鳴く鹿の",
        lower: "声聞く時ぞ　秋は悲しき"
      },
      {
        no: 6,
        upper: "かささぎの　渡せる橋に　置く霜の",
        lower: "白きを見れば　夜ぞ更けにける"
      },
      {
        no: 7,
        upper: "天の原　ふりさけ見れば　春日なる",
        lower: "三笠の山に　出でし月かも"
      },
      {
        no: 8,
        upper: "わが庵は　都のたつみ　しかぞ住む",
        lower: "世をうぢ山と　人はいふなり"
      },
      {
        no: 9,
        upper: "花の色は　移りにけりな　いたづらに",
        lower: "わが身世にふる　ながめせしまに"
      },
      {
        no: 10,
        upper: "これやこの　行くも帰るも　別れては",
        lower: "知るも知らぬも　逢坂の関"
      }
    ];

    let questions = [];
    let currentIndex = 0;
    let correctAnswers = 0;
    let answered = false;

    const questionEl = document.getElementById("question");
    const choicesEl = document.getElementById("choices");
    const feedbackEl = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");

    // 配列をランダムな順番にする
    function shuffle(array) {
      const result = [...array];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    // ゲームを開始・リセット
    function startGame() {
      questions = shuffle(poems);
      currentIndex = 0;
      correctAnswers = 0;
      answered = false;

      document.getElementById("result").style.display = "none";
      document.querySelector(".question-box").style.display = "block";
      document.querySelector("h2").style.display = "block";
      choicesEl.style.display = "grid";
      nextButton.style.display = "block";
      feedbackEl.style.display = "none";

      updateScore();
      showQuestion();
    }

    // 問題を表示
    function showQuestion() {
      answered = false;

      const poem = questions[currentIndex];

      // 上の句だけを表示する
      questionEl.textContent = poem.upper;

      document.getElementById("progress").textContent =
        (currentIndex + 1) + " / " + questions.length;

      feedbackEl.textContent = "";
      feedbackEl.className = "";
      feedbackEl.style.display = "none";

      nextButton.disabled = true;
      nextButton.textContent =
        currentIndex === questions.length - 1
          ? "結果を見る →"
          : "次の問題へ →";

      // 正解1つと不正解3つを用意する
      const wrongChoices = poems.filter(
        p => p.no !== poem.no
      );

      const options = shuffle([
        poem,
        ...shuffle(wrongChoices).slice(0, 3)
      ]);

      choicesEl.replaceChildren();

      options.forEach(option => {
        const button = document.createElement("button");
        button.className = "choice";
        button.textContent = option.lower;

        button.addEventListener("click", () => {
          checkAnswer(option, button);
        });

        choicesEl.appendChild(button);
      });
    }

    // 答え合わせ
    function checkAnswer(selected, selectedButton) {
      if (answered) return;
      answered = true;

      const correct = questions[currentIndex];
      const buttons = choicesEl.querySelectorAll(".choice");

      buttons.forEach(button => {
        button.disabled = true;

        // 正解の選択肢を緑色にする
        if (button.textContent === correct.lower) {
          button.classList.add("correct");
        }
      });

      if (selected.no === correct.no) {
        correctAnswers++;

        feedbackEl.className = "correct-message";
        feedbackEl.textContent = "⭕ 正解！よくできました！";
      } else {
        selectedButton.classList.add("wrong");

        feedbackEl.className = "wrong-message";
        feedbackEl.textContent =
          "❌ 不正解！\n正解は「" +
          correct.lower +
          "」です。";
      }

      feedbackEl.style.display = "block";

      updateScore();
      nextButton.disabled = false;
    }

    // 得点と正解率を更新
    function updateScore() {
      document.getElementById("correctCount").textContent =
        correctAnswers;

      const answeredCount =
        currentIndex + (answered ? 1 : 0);

      document.getElementById("accuracy").textContent =
        answeredCount === 0
          ? "0%"
          : Math.round(
              correctAnswers / answeredCount * 100
            ) + "%";
    }

    // 次の問題へ
    nextButton.addEventListener("click", () => {
      if (!answered) return;

      if (currentIndex < questions.length - 1) {
        currentIndex++;
        showQuestion();
        updateScore();
      } else {
        showResult();
      }
    });

    // 最終結果を表示
    function showResult() {
      document.querySelector(".question-box").style.display = "none";
      document.querySelector("h2").style.display = "none";
      choicesEl.style.display = "none";
      feedbackEl.style.display = "none";
      nextButton.style.display = "none";

      document.getElementById("result").style.display = "block";

      document.getElementById("finalScore").textContent =
        "10問中 " + correctAnswers + "問正解！";

      const percentage = correctAnswers * 10;
      let message;

      if (percentage === 100) {
        message = "満点！百人一首をよく覚えていますね！";
      } else if (percentage >= 70) {
        message = "すばらしい！あと少しで満点です！";
      } else if (percentage >= 40) {
        message = "いい調子！間違えた歌を復習しましょう！";
      } else {
        message = "何度も挑戦して、少しずつ覚えましょう！";
      }

      document.getElementById("finalMessage").textContent = message;
    }

    // もう一度挑戦
    document.getElementById("restartButton")
      .addEventListener("click", startGame);

    // ゲーム開始
    startGame();
  </script>
</body>
</html>
